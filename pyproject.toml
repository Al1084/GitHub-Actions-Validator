[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gha-validator"
dynamic = ["version"]
description = "CLI tool to validate GitHub Actions workflows: outdated versions, deprecated actions, missing permissions, YAML issues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexis Leclair", email = "alexisleclair19@gmail.com" }]
keywords = ["github-actions", "ci", "linter", "validator", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
gha-validate = "gha_validator.cli:main"

[project.urls]
Homepage = "https://github.com/Al1084/GitHub-Actions-Validator"
Issues = "https://github.com/Al1084/GitHub-Actions-Validator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "gha_validator.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
